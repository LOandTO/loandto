<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lo&To 재고">
<title>Lo&To 재고관리</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;background:#f4f5f7;color:#1a1a1a;min-height:100vh;padding-bottom:70px}
.app{max-width:480px;margin:0 auto}

/* 헤더 */
.header{background:#fff;padding:14px 16px 10px;text-align:center;border-bottom:1px solid #e8e8e8;position:sticky;top:0;z-index:50}
.header-title{font-size:16px;font-weight:700}
.sync-status{font-size:11px;color:#999;margin-top:2px}
.sync-status.on{color:#1D9E75}

/* 하단 탭 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;display:flex;z-index:100;max-width:480px;margin:0 auto}
.nav-item{flex:1;padding:10px 2px 12px;border:none;background:none;font-size:11px;color:#999;cursor:pointer;text-align:center}
.nav-item.active{color:#2563eb;font-weight:600}
.nav-icon{font-size:20px;display:block;margin-bottom:2px}

.screen{display:none;padding:12px}
.screen.active{display:block}

/* 공통 */
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.btn{width:100%;padding:13px;border:none;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;background:#eee;color:#333;margin-bottom:8px}
.btn:active{opacity:0.8;transform:scale(0.99)}
.btn-blue{background:#2563eb;color:#fff}
.btn-outline{background:#fff;border:1.5px solid #ddd}
input,select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;outline:none;background:#fff}
input:focus,select:focus{border-color:#2563eb}
label{display:block;font-size:13px;color:#666;margin-bottom:5px;font-weight:500}
.field{margin-bottom:12px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.92);color:#fff;border-radius:10px;padding:11px 18px;font-size:14px;display:none;z-index:999;max-width:90vw;text-align:center;line-height:1.5}
.empty{text-align:center;padding:40px 16px;color:#aaa;font-size:14px;line-height:1.8}

/* ══ 스캔 화면 ══ */
.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mode-btn{padding:16px 8px;border:2.5px solid #e0e0e0;border-radius:14px;background:#fff;font-size:17px;font-weight:700;cursor:pointer;color:#bbb;text-align:center}
.mode-btn .sub{display:block;font-size:11px;font-weight:400;margin-top:3px}
.mode-btn.active-in{border-color:#1D9E75;background:#e9f9f2;color:#0F6E56}
.mode-btn.active-out{border-color:#e2552c;background:#fdeee8;color:#b23c17}
.cam-area{background:#111;border-radius:14px;overflow:hidden;position:relative;margin-bottom:10px;min-height:230px;display:flex;align-items:center;justify-content:center}
#video{width:100%;max-height:280px;object-fit:cover;display:none}
.cam-off{color:#888;text-align:center;font-size:14px;padding:30px}
.cam-off .big{font-size:44px;display:block;margin-bottom:8px}
.scan-line{position:absolute;left:10%;right:10%;top:50%;height:2px;background:rgba(255,80,80,0.85);display:none}
.qty-bar{display:flex;gap:6px;margin-bottom:10px}
.qty-chip{flex:1;padding:11px 4px;border:1.5px solid #ddd;border-radius:10px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;text-align:center;color:#555}
.qty-chip.sel{border-color:#2563eb;background:#eaf1fe;color:#2563eb}
.last-action{background:#fff;border-radius:12px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.last-action .info{flex:1;font-size:13px;line-height:1.5}
.undo-btn{padding:8px 14px;border:1.5px solid #ddd;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#666;flex-shrink:0;margin-left:8px}

/* ══ 재고 화면 ══ */
.search-box{margin-bottom:10px}
.group-card{background:#fff;border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.group-head{padding:11px 14px;background:#fafafa;font-size:14px;font-weight:700;display:flex;justify-content:space-between;border-bottom:1px solid #f0f0f0}
.group-head .cnt{font-size:12px;color:#999;font-weight:400}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f5f5f5}
.item-row:last-child{border-bottom:none}
.item-name{font-size:14px}
.item-code{font-size:10px;color:#bbb;font-family:monospace}
.badge{font-size:13px;font-weight:700;padding:4px 12px;border-radius:16px;white-space:nowrap}
.b-ok{background:#e9f9f2;color:#0F6E56}
.b-low{background:#fff3dc;color:#9a6700}
.b-zero{background:#fdeaea;color:#b02a2a}
.summary-bar{display:flex;gap:8px;margin-bottom:10px}
.sum-chip{flex:1;background:#fff;border-radius:11px;padding:10px 4px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.sum-chip .n{font-size:19px;font-weight:700}
.sum-chip .t{font-size:11px;color:#999}

/* ══ 등록 ══ */
.size-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.size-row input.s{flex:2}
.size-row input.q{flex:1;text-align:center}
.size-row .x{width:38px;height:44px;border:1.5px solid #f3c1c1;border-radius:10px;background:#fdeaea;color:#b02a2a;font-size:17px;cursor:pointer;flex-shrink:0}
.step-info{font-size:13px;color:#666;background:#f4f6fa;border-radius:9px;padding:9px 12px;margin-bottom:12px;line-height:1.6}

/* ══ 라벨 ══ */
.label-item{display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid #f5f5f5;gap:10px}
.label-item input[type=checkbox]{width:20px;height:20px;flex-shrink:0}
.label-item .nm{flex:1;font-size:13px}
.label-item .qn{width:64px;padding:7px;text-align:center;font-size:14px;flex-shrink:0}

/* 관리 버튼 */
.mini-btns{display:flex;gap:6px;margin-top:8px}
.mini-btn{flex:1;padding:8px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid #ddd;background:#fff;color:#555}
.mini-btn.edit{border-color:#bcd4f6;background:#eef4fd;color:#2563eb}
.mini-btn.del{border-color:#f3c1c1;background:#fdeaea;color:#b02a2a}

/* 모달 */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:18px 18px 0 0;padding:20px 18px 26px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-title">Lo&To 재고관리</div>
    <div class="sync-status" id="sync-status">구글 연동 안됨</div>
  </div>

  <!-- ══════ 스캔 (홈) ══════ -->
  <div id="s-scan" class="screen active">
    <div class="mode-toggle">
      <button class="mode-btn" id="mode-in" onclick="setMode('in')">▲ 입고<span class="sub">물건 들어올 때</span></button>
      <button class="mode-btn" id="mode-out" onclick="setMode('out')">▼ 출고<span class="sub">물건 나갈 때</span></button>
    </div>

    <div class="cam-area" onclick="if(!camOn)startCam()">
      <video id="video" autoplay playsinline muted></video>
      <div class="cam-off" id="cam-off"><span class="big">📷</span>눌러서 카메라 켜기</div>
      <div class="scan-line" id="scan-line"></div>
    </div>

    <div class="qty-bar">
      <button class="qty-chip sel" data-q="1" onclick="setQty(1,this)">1개씩</button>
      <button class="qty-chip" data-q="5" onclick="setQty(5,this)">5개씩</button>
      <button class="qty-chip" data-q="10" onclick="setQty(10,this)">10개씩</button>
      <button class="qty-chip" data-q="0" onclick="askCustomQty(this)">직접</button>
    </div>

    <div class="last-action" id="last-action">
      <div class="info" id="last-info"></div>
      <button class="undo-btn" onclick="undoLast()">↩ 되돌리기</button>
    </div>

    <div class="card" style="margin-top:10px">
      <label>바코드 직접 입력</label>
      <div style="display:flex;gap:6px">
        <input type="text" id="manual" placeholder="바코드 번호" style="flex:1">
        <button class="btn" style="width:auto;padding:12px 16px;margin:0" onclick="manualScan()">확인</button>
      </div>
    </div>
  </div>

  <!-- ══════ 재고 ══════ -->
  <div id="s-stock" class="screen">
    <button class="btn btn-blue" onclick="pullFromGoogle()" style="margin-bottom:10px">↻ 최신 재고 불러오기</button>
    <div class="summary-bar">
      <div class="sum-chip"><div class="n" id="sum-items">0</div><div class="t">품목</div></div>
      <div class="sum-chip"><div class="n" id="sum-total">0</div><div class="t">총재고</div></div>
      <div class="sum-chip"><div class="n" id="sum-low" style="color:#9a6700">0</div><div class="t">부족</div></div>
      <div class="sum-chip"><div class="n" id="sum-zero" style="color:#b02a2a">0</div><div class="t">없음</div></div>
    </div>
    <div class="search-box"><input type="text" id="search" placeholder="🔍 상품 검색" oninput="renderStock()"></div>
    <div id="stock-list"></div>
    <div class="empty" id="stock-empty">등록된 상품이 없습니다.<br>등록 탭에서 추가해주세요.</div>
  </div>

  <!-- ══════ 등록 ══════ -->
  <div id="s-reg" class="screen">
    <div class="card">
      <div class="step-info">그룹 → 디자인 → 사이즈 순서로 입력하면 사이즈별 상품이 한꺼번에 등록됩니다.</div>
      <div class="field">
        <label>① 상품 그룹</label>
        <select id="r-group-sel" onchange="if(this.value)document.getElementById('r-group-new').value=''">
          <option value="">-- 기존 그룹 선택 --</option>
        </select>
        <input type="text" id="r-group-new" placeholder="또는 새 그룹 입력 (예: 체온보호 수영복)" style="margin-top:6px" oninput="if(this.value.trim())document.getElementById('r-group-sel').value=''">
      </div>
      <div class="field">
        <label>② 디자인명</label>
        <input type="text" id="r-design" placeholder="예: 블루스트라이프">
      </div>
      <div class="field">
        <label>③ 사이즈별 초기 재고</label>
        <div id="r-sizes"></div>
        <button class="btn btn-outline" onclick="addSizeRow()" style="color:#2563eb;border-color:#bcd4f6;border-style:dashed">+ 사이즈 추가</button>
      </div>
      <button class="btn btn-blue" onclick="registerAll()">전체 등록</button>
    </div>
    <div class="card" id="reg-result" style="display:none">
      <div style="font-weight:700;margin-bottom:8px">✓ 등록 완료</div>
      <div id="reg-result-list" style="font-size:13px;line-height:1.8"></div>
    </div>
  </div>

  <!-- ══════ 라벨 ══════ -->
  <div id="s-label" class="screen">
    <div class="card">
      <div class="field">
        <label>라벨지 종류 (A4)</label>
        <select id="label-format">
          <option value="24">폼텍 24칸 (3×8칸, 64×34mm) - 추천</option>
          <option value="21">21칸 (3×7칸, 64×38mm)</option>
          <option value="14">14칸 (2×7칸, 99×38mm)</option>
        </select>
      </div>
      <div style="font-size:12px;color:#888;line-height:1.6;margin-bottom:4px">각 상품의 인쇄 매수를 정하고 인쇄 버튼을 누르세요. 처음엔 일반 A4에 시험 인쇄해서 위치를 확인하세요.</div>
    </div>
    <div class="card" style="padding:6px 4px">
      <div style="display:flex;justify-content:space-between;padding:8px 12px;font-size:12px;color:#999">
        <span>상품 선택</span><span>매수</span>
      </div>
      <div id="label-list"></div>
      <div class="empty" id="label-empty" style="padding:24px">등록된 상품이 없습니다.</div>
    </div>
    <button class="btn btn-blue" onclick="printLabels()">🖨 라벨 인쇄하기</button>
  </div>

  <!-- ══════ 관리 ══════ -->
  <div id="s-manage" class="screen">
    <div class="card">
      <label style="font-weight:700;margin-bottom:10px">구글 시트 연동</label>
      <input type="text" id="gurl" placeholder="https://script.google.com/macros/s/..." style="font-size:12px;margin-bottom:8px">
      <button class="btn btn-blue" onclick="saveGoogleUrl()">연동 저장</button>
      <button class="btn btn-outline" onclick="syncToGoogle()">전체 동기화 (앱→시트)</button>
      <button class="btn btn-outline" onclick="pullFromGoogle()" style="margin-bottom:0">불러오기 (시트→앱)</button>
    </div>
    <div class="card">
      <label style="font-weight:700;margin-bottom:10px">데이터 내보내기</label>
      <button class="btn btn-outline" onclick="exportCSV('stock')">재고 현황 CSV (엑셀용)</button>
      <button class="btn btn-outline" onclick="exportCSV('log')" style="margin-bottom:0">입출고 이력 CSV (엑셀용)</button>
    </div>
    <div style="font-size:13px;font-weight:700;color:#666;margin:14px 4px 8px">상품 수정 / 삭제 <span style="font-weight:400;color:#999;font-size:12px">(그룹을 누르면 펼쳐집니다)</span></div>
    <div id="manage-list"></div>
    <div class="empty" id="manage-empty">등록된 상품이 없습니다.</div>
  </div>
</div>

<!-- 하단 탭 -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="go('scan',this)"><span class="nav-icon">📷</span>스캔</button>
  <button class="nav-item" onclick="go('stock',this)"><span class="nav-icon">📦</span>재고</button>
  <button class="nav-item" onclick="go('reg',this)"><span class="nav-icon">＋</span>등록</button>
  <button class="nav-item" onclick="go('label',this)"><span class="nav-icon">🏷</span>라벨</button>
  <button class="nav-item" onclick="go('manage',this)"><span class="nav-icon">⚙</span>관리</button>
</div>

<!-- 수정 모달 -->
<div class="modal" id="m-edit">
  <div class="modal-box">
    <div class="modal-title">상품 수정</div>
    <div class="field"><label>그룹</label><input type="text" id="e-group"></div>
    <div class="field"><label>디자인/사이즈</label><input type="text" id="e-size"></div>
    <div class="field"><label>현재 재고</label><input type="number" id="e-stock" min="0"></div>
    <div class="field"><label>부족 알림 기준</label><input type="number" id="e-min" min="0"></div>
    <div class="modal-btns">
      <button class="btn btn-outline" style="margin:0" onclick="closeModal()">취소</button>
      <button class="btn btn-blue" style="margin:0" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="bc-canvas" style="display:none"></canvas>

<script>
/* ═══════════ 데이터 ═══════════ */
let P=JSON.parse(localStorage.getItem('lt2_products')||'[]');   // {code,group,size,stock,minStock}
let L=JSON.parse(localStorage.getItem('lt2_logs')||'[]');
let GURL=localStorage.getItem('lt2_gurl')||'';
let mode='';            // 'in' | 'out'
let qty=1;
let camOn=false, reader=null;
let lastTx=null;        // 되돌리기용
let lastScanCode='', lastScanAt=0;
let editCode=null;

const $=id=>document.getElementById(id);
function save(){localStorage.setItem('lt2_products',JSON.stringify(P));localStorage.setItem('lt2_logs',JSON.stringify(L));}
function toast(m,d=2200){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',d);}
function groups(){const g={};P.forEach(p=>{(g[p.group]=g[p.group]||[]).push(p)});return g;}
function syncBadge(){const s=$('sync-status');if(GURL){s.textContent='● 구글 시트 연동됨';s.classList.add('on');}else{s.textContent='구글 연동 안됨';s.classList.remove('on');}}

/* ═══════════ 탭 이동 ═══════════ */
function go(name,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('s-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  if(name==='stock')renderStock();
  if(name==='reg')renderReg();
  if(name==='label')renderLabel();
  if(name==='manage')renderManage();
  if(name!=='scan'&&camOn)stopCam();
}

/* ═══════════ 스캔 ═══════════ */
function setMode(m){
  mode=m;
  $('mode-in').classList.toggle('active-in',m==='in');
  $('mode-out').classList.toggle('active-out',m==='out');
  toast(m==='in'?'입고 모드 — 스캔하면 자동 입고됩니다':'출고 모드 — 스캔하면 자동 출고됩니다');
  if(!camOn)startCam();
}
function setQty(q,el){
  qty=q;
  document.querySelectorAll('.qty-chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}
function askCustomQty(el){
  const v=prompt('수량을 입력하세요');
  const n=parseInt(v);
  if(n>0){qty=n;document.querySelectorAll('.qty-chip').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');el.textContent=n+'개씩';}
}
async function startCam(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});
    const v=$('video');v.srcObject=st;v.style.display='block';
    $('cam-off').style.display='none';$('scan-line').style.display='block';
    camOn=true;
    reader=new ZXing.BrowserMultiFormatReader();
    reader.decodeFromVideoElement(v,res=>{if(res)onScan(res.getText());});
  }catch(e){toast('카메라 권한을 허용해주세요');}
}
function stopCam(){
  if(reader){try{reader.reset()}catch(e){}}
  const v=$('video');
  if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
  v.style.display='none';$('cam-off').style.display='block';$('scan-line').style.display='none';
  camOn=false;
}
function onScan(code){
  const now=Date.now();
  if(code===lastScanCode&&now-lastScanAt<2500)return;  // 중복 방지
  lastScanCode=code;lastScanAt=now;
  const p=P.find(x=>x.code===code.trim());
  if(!p){toast('미등록 바코드: '+code);navigator.vibrate&&navigator.vibrate(200);return;}
  if(!mode){toast('먼저 위에서 입고/출고 모드를 선택하세요',2800);return;}
  processTx(p,mode,qty);
}
function manualScan(){
  const code=$('manual').value.trim();
  if(!code){toast('바코드 번호를 입력해주세요');return;}
  $('manual').value='';
  lastScanCode='';
  onScan(code);
}
function processTx(p,m,q){
  if(m==='out'&&p.stock<q){toast('재고 부족! 현재 '+p.stock+'개',2800);navigator.vibrate&&navigator.vibrate([100,50,100]);return;}
  const i=P.findIndex(x=>x.code===p.code);
  P[i].stock+=(m==='in'?q:-q);
  const entry={time:new Date().toLocaleString('ko-KR'),code:p.code,group:p.group,size:p.size,type:m==='in'?'입고':'출고',qty:q,stock:P[i].stock};
  L.unshift(entry);save();
  lastTx={code:p.code,m,q};
  $('last-action').style.display='flex';
  $('last-info').innerHTML=`<b>${p.group} · ${p.size}</b><br>${m==='in'?'▲ 입고':'▼ 출고'} ${q}개 → 잔여 <b>${P[i].stock}개</b>`;
  navigator.vibrate&&navigator.vibrate(60);
  toast((m==='in'?'▲ 입고 ':'▼ 출고 ')+q+'개 · 잔여 '+P[i].stock+'개');
  if(GURL)sendLog(entry);
}
function undoLast(){
  if(!lastTx)return;
  const i=P.findIndex(x=>x.code===lastTx.code);
  if(i===-1)return;
  P[i].stock+=(lastTx.m==='in'?-lastTx.q:lastTx.q);
  const entry={time:new Date().toLocaleString('ko-KR'),code:P[i].code,group:P[i].group,size:P[i].size,type:lastTx.m==='in'?'출고':'입고',qty:lastTx.q,stock:P[i].stock};
  L.unshift(entry);save();
  toast('되돌렸습니다 → 잔여 '+P[i].stock+'개');
  $('last-action').style.display='none';
  if(GURL)sendLog(entry);
  lastTx=null;
}

/* ═══════════ 재고 ═══════════ */
function renderStock(){
  $('sum-items').textContent=P.length;
  $('sum-total').textContent=P.reduce((s,p)=>s+p.stock,0);
  $('sum-low').textContent=P.filter(p=>p.stock>0&&p.stock<=p.minStock).length;
  $('sum-zero').textContent=P.filter(p=>p.stock===0).length;
  const kw=($('search').value||'').toLowerCase();
  const list=$('stock-list'),emp=$('stock-empty');
  if(!P.length){list.innerHTML='';emp.style.display='block';return;}
  emp.style.display='none';
  const g=groups();
  list.innerHTML=Object.entries(g).map(([gn,items],gi)=>{
    const filtered=kw?items.filter(p=>(gn+p.size).toLowerCase().includes(kw)):items;
    if(!filtered.length)return'';
    const zero=filtered.filter(p=>p.stock===0).length;
    const low=filtered.filter(p=>p.stock>0&&p.stock<=p.minStock).length;
    let warn='';
    if(zero)warn+=` <span style="color:#b02a2a;font-size:11px;font-weight:700">없음${zero}</span>`;
    if(low)warn+=` <span style="color:#9a6700;font-size:11px;font-weight:700">부족${low}</span>`;
    const rows=filtered.map(p=>{
      let c='b-ok',t=p.stock+'개';
      if(p.stock===0){c='b-zero';t='없음';}
      else if(p.stock<=p.minStock){c='b-low';t=p.stock+'개';}
      return`<div class="item-row"><div><div class="item-name">${p.size}</div><div class="item-code">${p.code}</div></div><div class="badge ${c}">${t}</div></div>`;
    }).join('');
    const openNow=kw?'block':'none';  // 검색 중이면 자동으로 펼침
    const arrow=kw?'▾':'▸';
    return`<div class="group-card">
      <div class="group-head" style="cursor:pointer" onclick="toggleGroup('sg-${gi}',this)">
        <span>${arrow} ${gn}${warn}</span><span class="cnt">${filtered.reduce((s,p)=>s+p.stock,0)}개</span>
      </div>
      <div id="sg-${gi}" style="display:${openNow}">${rows}</div>
    </div>`;
  }).join('');
}

/* ═══════════ 등록 ═══════════ */
function renderReg(){
  const sel=$('r-group-sel');
  sel.innerHTML='<option value="">-- 기존 그룹 선택 --</option>';
  Object.keys(groups()).forEach(g=>sel.innerHTML+=`<option>${g}</option>`);
  if(!$('r-sizes').children.length)addSizeRow();
}
function addSizeRow(){
  const d=document.createElement('div');
  d.className='size-row';
  d.innerHTML=`<input class="s" placeholder="사이즈 (예: S)"><input class="q" type="number" value="0" min="0" placeholder="재고"><button class="x" onclick="this.parentNode.remove()">×</button>`;
  $('r-sizes').appendChild(d);
}
function registerAll(){
  const group=$('r-group-sel').value||$('r-group-new').value.trim();
  const design=$('r-design').value.trim();
  if(!group){toast('그룹을 선택하거나 입력해주세요');return;}
  if(!design){toast('디자인명을 입력해주세요');return;}
  const added=[];
  $('r-sizes').querySelectorAll('.size-row').forEach(r=>{
    const size=r.querySelector('.s').value.trim();
    const stock=parseInt(r.querySelector('.q').value)||0;
    if(!size)return;
    const code='LT'+Date.now().toString().slice(-8)+Math.floor(Math.random()*90+10);
    P.push({code,group,size:design+' / '+size,stock,minStock:10});
    added.push({group,size:design+' / '+size,stock,code});
  });
  if(!added.length){toast('사이즈를 하나 이상 입력해주세요');return;}
  save();
  if(GURL)syncToGoogle(true);
  $('reg-result').style.display='block';
  $('reg-result-list').innerHTML=added.map(a=>`${a.group} · ${a.size} (재고 ${a.stock}개)`).join('<br>');
  $('r-design').value='';$('r-group-new').value='';
  $('r-sizes').innerHTML='';addSizeRow();
  renderReg();
  toast(added.length+'개 등록 완료! 라벨 탭에서 스티커를 인쇄하세요',3000);
}

/* ═══════════ 라벨 인쇄 ═══════════ */
function renderLabel(){
  const list=$('label-list'),emp=$('label-empty');
  if(!P.length){list.innerHTML='';emp.style.display='block';return;}
  emp.style.display='none';
  list.innerHTML=P.map((p,i)=>`
    <div class="label-item">
      <input type="checkbox" id="lb-${i}" checked>
      <div class="nm">${p.group}<br><span style="color:#999;font-size:11px">${p.size}</span></div>
      <input type="number" class="qn" id="ln-${i}" value="4" min="1">
    </div>`).join('');
}
const FORMATS={
  '24':{cols:3,rows:8,w:64,h:34,top:12.7,left:7,gx:2.5,gy:0},
  '21':{cols:3,rows:7,w:64,h:38,top:15,left:7,gx:2.5,gy:0},
  '14':{cols:2,rows:7,w:99,h:38,top:15,left:5,gx:2.5,gy:0}
};
function printLabels(){
  const f=FORMATS[$('label-format').value];
  const items=[];
  P.forEach((p,i)=>{
    const cb=$('lb-'+i);if(!cb||!cb.checked)return;
    const n=parseInt($('ln-'+i).value)||1;
    for(let k=0;k<n;k++)items.push(p);
  });
  if(!items.length){toast('인쇄할 상품을 선택해주세요');return;}
  const bc=$('bc-canvas');
  const perPage=f.cols*f.rows;
  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>라벨 인쇄</title><style>
  @page{size:A4;margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
  .page{width:210mm;height:297mm;position:relative;page-break-after:always}
  .lb{position:absolute;width:${f.w}mm;height:${f.h}mm;text-align:center;overflow:hidden;padding:1mm;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .lb .g{font-size:7.5pt;font-weight:700;white-space:nowrap;overflow:hidden;max-width:100%}
  .lb .s{font-size:6.5pt;color:#333;white-space:nowrap;overflow:hidden;max-width:100%}
  .lb img{max-width:92%;height:auto;max-height:${f.h*0.5}mm}
  </style></head><body>`;
  for(let pg=0;pg*perPage<items.length;pg++){
    html+='<div class="page">';
    for(let k=0;k<perPage;k++){
      const idx=pg*perPage+k;
      if(idx>=items.length)break;
      const p=items[idx];
      const col=k%f.cols,row=Math.floor(k/f.cols);
      const x=f.left+col*(f.w+f.gx);
      const y=f.top+row*(f.h+f.gy);
      let img='';
      try{
        JsBarcode(bc,p.code,{format:'CODE128',width:2,height:40,displayValue:true,fontSize:10,margin:2,background:'#fff',lineColor:'#000'});
        img=`<img src="${bc.toDataURL('image/png')}">`;
      }catch(e){}
      html+=`<div class="lb" style="left:${x}mm;top:${y}mm"><div class="g">${p.group}</div><div class="s">${p.size}</div>${img}</div>`;
    }
    html+='</div>';
  }
  html+='</body></html>';
  const w=window.open('','_blank');
  if(!w){toast('팝업이 차단되었습니다. 브라우저 설정에서 팝업을 허용해주세요',3500);return;}
  w.document.write(html);w.document.close();
  w.onload=()=>w.print();
}

/* ═══════════ 관리 ═══════════ */
function renderManage(){
  $('gurl').value=GURL;
  const list=$('manage-list'),emp=$('manage-empty');
  if(!P.length){list.innerHTML='';emp.style.display='block';return;}
  emp.style.display='none';
  const g=groups();
  list.innerHTML=Object.entries(g).map(([gn,items],gi)=>{
    const rows=items.map(p=>`
      <div style="padding:10px 14px;border-bottom:1px solid #f5f5f5">
        <div style="font-size:14px">${p.size}</div>
        <div style="font-size:10px;color:#bbb;font-family:monospace">${p.code} · 재고 ${p.stock}개</div>
        <div class="mini-btns">
          <button class="mini-btn edit" onclick="openEdit('${p.code}')">수정</button>
          <button class="mini-btn del" onclick="delItem('${p.code}')">삭제</button>
        </div>
      </div>`).join('');
    return`<div class="group-card">
      <div class="group-head" style="cursor:pointer" onclick="toggleGroup('mg-${gi}',this)">
        <span>▸ ${gn}</span><span class="cnt">${items.length}종</span>
      </div>
      <div id="mg-${gi}" style="display:none">${rows}</div>
    </div>`;
  }).join('');
}
function toggleGroup(id,head){
  const el=$(id);
  const open=el.style.display!=='none';
  el.style.display=open?'none':'block';
  const sp=head.querySelector('span');
  sp.innerHTML=(open?'▸':'▾')+sp.innerHTML.slice(1);
}
function openEdit(code){
  const p=P.find(x=>x.code===code);if(!p)return;
  editCode=code;
  $('e-group').value=p.group;$('e-size').value=p.size;
  $('e-stock').value=p.stock;$('e-min').value=p.minStock;
  $('m-edit').classList.add('open');
}
function closeModal(){$('m-edit').classList.remove('open');editCode=null;}
function saveEdit(){
  const i=P.findIndex(x=>x.code===editCode);if(i===-1)return;
  const g=$('e-group').value.trim(),s=$('e-size').value.trim();
  if(!g||!s){toast('내용을 입력해주세요');return;}
  P[i].group=g;P[i].size=s;
  P[i].stock=parseInt($('e-stock').value)||0;
  P[i].minStock=parseInt($('e-min').value)||10;
  save();closeModal();renderManage();
  toast('수정 완료');
  if(GURL)syncToGoogle(true);
}
function delItem(code){
  const p=P.find(x=>x.code===code);if(!p)return;
  if(!confirm(p.group+' · '+p.size+'\n재고 '+p.stock+'개\n\n정말 삭제할까요? 복구할 수 없습니다.'))return;
  P=P.filter(x=>x.code!==code);save();renderManage();
  toast('삭제 완료');
  if(GURL)syncToGoogle(true);
}

/* ═══════════ 구글 연동 ═══════════ */
function saveGoogleUrl(){
  const u=$('gurl').value.trim();
  if(!u.startsWith('https://script.google.com')){toast('올바른 Apps Script URL이 아닙니다');return;}
  GURL=u;localStorage.setItem('lt2_gurl',u);syncBadge();
  toast('연동 저장! 동기화 테스트 중...');
  syncToGoogle();
}
async function syncToGoogle(silent){
  if(!GURL){if(!silent)toast('구글 URL을 먼저 설정하세요');return;}
  try{
    await fetch(GURL,{method:'POST',body:JSON.stringify({action:'sync',products:P,logs:L.slice(0,300)}),headers:{'Content-Type':'text/plain'}});
    if(!silent)toast('구글 시트 동기화 완료!');
  }catch(e){if(!silent)toast('동기화 실패 — 인터넷 연결 확인');}
}
async function sendLog(entry){
  try{await fetch(GURL,{method:'POST',body:JSON.stringify({action:'log',log:entry}),headers:{'Content-Type':'text/plain'}});}catch(e){}
}
async function pullFromGoogle(){
  if(!GURL){toast('관리 탭에서 구글 연동을 먼저 설정하세요');return;}
  toast('불러오는 중...');
  try{
    const r=await fetch(GURL,{method:'POST',body:JSON.stringify({action:'pull'}),headers:{'Content-Type':'text/plain'}});
    const d=await r.json();
    if(d.ok&&d.products){P=d.products.map(p=>({code:String(p.code),group:p.group,size:p.size,stock:Number(p.stock)||0,minStock:Number(p.minStock)||10}));save();renderStock();toast('불러오기 완료 — '+P.length+'개 품목');}
    else toast('불러오기 실패');
  }catch(e){toast('불러오기 실패 — 인터넷 연결 확인');}
}

/* ═══════════ CSV ═══════════ */
function exportCSV(kind){
  let header,rows,name;
  if(kind==='stock'){
    if(!P.length){toast('상품이 없습니다');return;}
    header='그룹,디자인/사이즈,바코드,재고,부족기준\n';
    rows=P.map(p=>`"${p.group}","${p.size}",${p.code},${p.stock},${p.minStock}`).join('\n');
    name='재고현황';
  }else{
    if(!L.length){toast('이력이 없습니다');return;}
    header='날짜,그룹,디자인/사이즈,바코드,구분,수량,잔여\n';
    rows=L.map(l=>`${l.time},"${l.group}","${l.size}",${l.code},${l.type},${l.qty},${l.stock}`).join('\n');
    name='입출고이력';
  }
  const blob=new Blob(['\uFEFF'+header+rows],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='LoTo_'+name+'_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('CSV 저장 완료 (엑셀에서 열립니다)');
}

/* 시작 */
syncBadge();
</script>
